crons:
  - name: wa-reminders
    description: "Daily WhatsApp payment reminders (H-2, H, H+2) at 09:00 WIB"
    cron: "0 9 * * *"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/v1/cron/reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
